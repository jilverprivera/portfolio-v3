<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7370"/></marker></defs><rect x="30" y="100" width="190" height="110" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="125.0" y="148.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Request</text><text x="125.0" y="175.5" font-size="17" fill="#a3aaa6" text-anchor="middle">signed-in staff</text><rect x="270" y="100" width="190" height="110" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="365.0" y="148.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">JWT</text><text x="365.0" y="175.5" font-size="17" fill="#a3aaa6" text-anchor="middle">Supabase Auth</text><rect x="510" y="100" width="190" height="110" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="605.0" y="148.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">API</text><text x="605.0" y="175.5" font-size="17" fill="#a3aaa6" text-anchor="middle">tenant + role</text><rect x="750" y="100" width="190" height="110" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="845.0" y="148.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">SET LOCAL</text><text x="845.0" y="175.5" font-size="17" fill="#a3aaa6" text-anchor="middle">per transaction</text><rect x="990" y="100" width="180" height="110" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="1080.0" y="148.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Forced RLS</text><text x="1080.0" y="175.5" font-size="17" fill="#a3aaa6" text-anchor="middle">tenant_id</text><path d="M220,155 L270,155" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M460,155 L510,155" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M700,155 L750,155" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M940,155 L990,155" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="60" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">The database rejects any query without a tenant</text><rect x="30" y="270" width="1140" height="220" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="304" font-size="22" font-weight="700" fill="#3ecf8e">Rules</text><rect x="60" y="325" width="320" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="220.0" y="362.5" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Own database roles</text><text x="220.0" y="389.5" font-size="17" fill="#a3aaa6" text-anchor="middle">never the service_role key</text><rect x="440" y="325" width="320" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="600.0" y="362.5" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Private buckets</text><text x="600.0" y="389.5" font-size="17" fill="#a3aaa6" text-anchor="middle">signed URLs, 5 minutes</text><rect x="820" y="325" width="320" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="980.0" y="362.5" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Immutable audit log</text><text x="980.0" y="389.5" font-size="17" fill="#a3aaa6" text-anchor="middle">who, what, when</text><text x="600" y="455" font-size="17" fill="#a3aaa6" text-anchor="middle">Many pharmacies share one database, so isolation lives there.</text></svg>