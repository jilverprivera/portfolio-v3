<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="70" width="200" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="130.0" y="113.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Purchase</text><text x="130.0" y="140.5" font-size="17" fill="#a1a1a1" text-anchor="middle">supplier order</text><rect x="265" y="70" width="200" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="365.0" y="113.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Receipt</text><text x="365.0" y="140.5" font-size="17" fill="#a1a1a1" text-anchor="middle">creates a batch</text><path d="M230,120 L265,120" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="500" y="70" width="200" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="600.0" y="113.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Movements</text><text x="600.0" y="140.5" font-size="17" fill="#a1a1a1" text-anchor="middle">immutable, per batch</text><path d="M465,120 L500,120" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="735" y="70" width="200" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="835.0" y="113.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">FEFO sale</text><text x="835.0" y="140.5" font-size="17" fill="#a1a1a1" text-anchor="middle">expires first, sold first</text><path d="M700,120 L735,120" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="970" y="70" width="200" height="100" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="1070.0" y="113.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Alerts</text><text x="1070.0" y="140.5" font-size="17" fill="#a1a1a1" text-anchor="middle">expiry · low stock</text><path d="M935,120 L970,120" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="50" font-size="18" font-weight="700" fill="#f5f5f2" text-anchor="middle">Every unit can be traced from the supplier to the customer</text><rect x="30" y="230" width="1140" height="260" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="264" font-size="22" font-weight="700" fill="#3ecf8e">Inside one transaction</text><rect x="60" y="285" width="320" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="220.0" y="309.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Lock batches</text><text x="220.0" y="336.0" font-size="17" fill="#a1a1a1" text-anchor="middle">SELECT … FOR UPDATE</text><text x="220.0" y="363.0" font-size="17" fill="#a1a1a1" text-anchor="middle">canonical order</text><rect x="440" y="285" width="320" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="600.0" y="309.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Deduct stock</text><text x="600.0" y="336.0" font-size="17" fill="#a1a1a1" text-anchor="middle">FEFO, never negative</text><text x="600.0" y="363.0" font-size="17" fill="#a1a1a1" text-anchor="middle">in base unit</text><rect x="820" y="285" width="320" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="980.0" y="309.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Record the sale</text><text x="980.0" y="336.0" font-size="17" fill="#a1a1a1" text-anchor="middle">control log entry</text><text x="980.0" y="363.0" font-size="17" fill="#a1a1a1" text-anchor="middle">balance projected</text><path d="M380,330 L440,330" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M760,330 L820,330" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="430" font-size="17" fill="#a1a1a1" text-anchor="middle">Fractions (box, blister, tablet) are sold without opening boxes.</text><text x="600" y="456" font-size="17" fill="#a1a1a1" text-anchor="middle">A recall finds the affected batches and who bought them.</text></svg>