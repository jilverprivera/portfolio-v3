<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="50" width="1140" height="200" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#8cc765">At the counter · no connection needed</text><rect x="55" y="105" width="200" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="155.0" y="148.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Sale</text><text x="155.0" y="175.5" font-size="17" fill="#a1a1a1" text-anchor="middle">UUID v7 id</text><rect x="300" y="105" width="230" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="415.0" y="134.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Local queue</text><text x="415.0" y="161.0" font-size="17" fill="#a1a1a1" text-anchor="middle">IndexedDB</text><text x="415.0" y="188.0" font-size="17" fill="#a1a1a1" text-anchor="middle">Idempotency-Key</text><rect x="575" y="105" width="230" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="690.0" y="147.5" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Bundle</text><text x="690.0" y="174.5" font-size="17" fill="#a1a1a1" text-anchor="middle">products · prices · batches</text><rect x="850" y="105" width="295" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="997.5" y="147.5" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Keeps selling</text><text x="997.5" y="174.5" font-size="17" fill="#a1a1a1" text-anchor="middle">up to 8 h or 500 sales</text><path d="M255,155 L300,155" fill="none" stroke="#6e6e73" stroke-width="2.5