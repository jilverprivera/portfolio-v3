<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="50" width="540" height="200" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#8cc765">Works without a signal</text><rect x="55" y="110" width="155" height="80" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="132.5" y="152.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">New animals</text><rect x="227" y="110" width="155" height="80" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="304.5" y="152.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Weighings</text><rect x="399" y="110" width="155" height="80" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="476.5" y="152.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Photos</text><text x="300" y="228" font-size="17" fill="#a1a1a1" text-anchor="middle">plus everything already opened is readable</text><rect x="630" y="50" width="540" height="200" rx="18" fill="none" stroke="#4a504d" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="650" y="84" font-size="22" font-weight="700" fill="#b8b8b8">Needs a connection</text><rect x="655" y="100" width="155" height="52" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="732.5" y="128.0" font-size="19" font-weight="700" fill="#f5f5f2" text-anchor="middle">Health</text><rect x="827" y="100" width="155" height="52" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="904.5" y="128.0" font-size="19" font-weight="700" fill="#f5f5f2" text-anchor="middle">Feeding</text><rect x="999" y="100" width="155" height="52" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="1076.5" y="128.0" font-size="19" font-weight="700" fill="#f5f5f2" text-anchor="middle">Milk</text><rect x="655" y="162" width="155" height="52" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="732.5" y="190.0" font-size="19" font-weight="700" fill="#f5f5f2" text-anchor="middle">Supplies</text><rect x="827" y="162" width="155" height="52" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="904.5" y="190.0" font-size="19" font-weight="700" fill="#f5f5f2" text-anchor="middle">Finance</text><rect x="999" y="162" width="155" height="52" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="1076.5" y="190.0" font-size="19" font-weight="700" fill="#f5f5f2" text-anchor="middle">Paddocks</text><rect x="30" y="320" width="210" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="135.0" y="359.0" font-size="21" font-weight="700" fill="#f5f5f2" text-anchor="middle">Tap save</text><text x="135.0" y="386.0" font-size="17" fill="#a1a1a1" text-anchor="middle">no signal</text><rect x="290" y="320" width="230" height="100" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="405.0" y="359.0" font-size="21" font-weight="700" fill="#f5f5f2" text-anchor="middle">Local queue</text><text x="405.0" y="386.0" font-size="17" fill="#a1a1a1" text-anchor="middle">id made on the phone</text><path d="M240,370 L290,370" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="580" y="320" width="270" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="715.0" y="346.0" font-size="21" font-weight="700" fill="#f5f5f2" text-anchor="middle">Sync triggers</text><text x="715.0" y="373.0" font-size="17" fill="#a1a1a1" text-anchor="middle">network back · app opens</text><text x="715.0" y="397.0" font-size="17" fill="#a1a1a1" text-anchor="middle">every 30 seconds</text><path d="M520,370 L580,370" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="900" y="320" width="270" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="1035.0" y="359.0" font-size="21" font-weight="700" fill="#f5f5f2" text-anchor="middle">Server function</text><text x="1035.0" y="386.0" font-size="17" fill="#a1a1a1" text-anchor="middle">same id, same result</text><path d="M850,370 L900,370" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="430" y="500" width="220" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="540.0" y="534.0" font-size="21" font-weight="700" fill="#f5f5f2" text-anchor="middle">Saved</text><text x="540.0" y="561.0" font-size="17" fill="#a1a1a1" text-anchor="middle">or already saved</text><rect x="690" y="500" width="280" height="90" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="830.0" y="534.0" font-size="21" font-weight="700" fill="#f5f5f2" text-anchor="middle">Rejected</text><text x="830.0" y="561.0" font-size="17" fill="#a1a1a1" text-anchor="middle">stays visible: fix or discard</text><path d="M1035,420 L1035,460 L540,460 L540,500" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M1035,460 L830,460 L830,500" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="140" y="540" font-size="18" fill="#a1a1a1" text-anchor="middle">A repeated send never</text><text x="140" y="565" font-size="18" fill="#a1a1a1" text-anchor="middle">duplicates a record.</text></svg>