<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7370"/></marker></defs><rect x="30" y="80" width="210" height="100" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="135.0" y="119.0" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">A change</text><text x="135.0" y="146.0" font-size="17" fill="#a3aaa6" text-anchor="middle">or a schedule</text><rect x="300" y="80" width="250" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="425.0" y="106.0" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">Notification</text><text x="425.0" y="133.0" font-size="17" fill="#a3aaa6" text-anchor="middle">row in the database</text><text x="425.0" y="157.0" font-size="17" fill="#a3aaa6" text-anchor="middle">written by a trigger</text><path d="M240,130 L300,130" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="330" width="210" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="135.0" y="356.0" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">pg_cron</text><text x="135.0" y="383.0" font-size="17" fill="#a3aaa6" text-anchor="middle">07:00 and 17:00</text><text x="135.0" y="407.0" font-size="17" fill="#a3aaa6" text-anchor="middle">scheduled alerts</text><path d="M135,330 L135,180" fill="none" stroke="#6b7370" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="600" y="50" width="570" height="160" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="620" y="84" font-size="22" font-weight="700" fill="#8cc765">In the app, within seconds</text><rect x="625" y="100" width="230" height="85" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="740.0" y="131.5" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">Realtime</text><text x="740.0" y="158.5" font-size="17" fill="#a3aaa6" text-anchor="middle">pushes the new row</text><rect x="900" y="100" width="245" height="85" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="1022.5" y="131.5" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">Bell and inbox</text><text x="1022.5" y="158.5" font-size="17" fill="#a3aaa6" text-anchor="middle">unread count</text><path d="M550,110 L600,110" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M855,142 L900,142" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="270" width="870" height="340" rx="18" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="320" y="304" font-size="22" font-weight="700" fill="#f0883e">Push to the phone</text><rect x="325" y="330" width="210" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="430.0" y="356.0" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">Delivery queue</text><text x="430.0" y="383.0" font-size="17" fill="#a3aaa6" text-anchor="middle">one row per</text><text x="430.0" y="407.0" font-size="17" fill="#a3aaa6" text-anchor="middle">device</text><rect x="585" y="330" width="210" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="690.0" y="369.0" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">send-push</text><text x="690.0" y="396.0" font-size="17" fill="#a3aaa6" text-anchor="middle">Edge Function</text><rect x="845" y="330" width="135" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="912.5" y="382.0" font-size="21" font-weight="700" fill="#f2f2f2" text-anchor="middle">Expo</text><rect x="1010" y="330" width="135" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="1077.5" y="382.0" font-size="19" font-weight="700" fill="#f2f2f2" text-anchor="middle">APNs · FCM</text><path d="M535,380 L585,380" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M795,380 L845,380" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M980,380 L1010,380" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M425,180 L425,330" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><text x="470" y="255" font-size="17" fill="#f2f2f2" text-anchor="middle">trigger</text><rect x="585" y="500" width="210" height="80" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="690.0" y="529.0" font-size="19" font-weight="700" fill="#f2f2f2" text-anchor="middle">pg_net + sweep</text><text x="690.0" y="556.0" font-size="17" fill="#a3aaa6" text-anchor="middle">wake-up, every minute</text><path d="M690,500 L690,430" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><rect x="845" y="500" width="300" height="80" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="995.0" y="529.0" font-size="19" font-weight="700" fill="#f2f2f2" text-anchor="middle">Receipts and retries</text><text x="995.0" y="556.0" font-size="17" fill="#a3aaa6" text-anchor="middle">3 attempts · receipts at 15 min</text><path d="M995,430 L995,500" fill="none" stroke="#6b7370" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="135" y="470" font-size="18" fill="#a3aaa6" text-anchor="middle">Each person picks</text><text x="135" y="495" font-size="18" fill="#a3aaa6" text-anchor="middle">categories and quiet</text><text x="135" y="520" font-size="18" fill="#a3aaa6" text-anchor="middle">hours.</text></svg>