<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7370"/></marker></defs><rect x="30" y="100" width="208" height="130" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="134.0" y="144.0" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Connection pool</text><text x="134.0" y="171.0" font-size="17" fill="#a3aaa6" text-anchor="middle">25 per replica</text><text x="134.0" y="198.0" font-size="17" fill="#a3aaa6" text-anchor="middle">query time limits</text><rect x="263" y="100" width="208" height="130" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="367.0" y="144.0" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Ingest cache</text><text x="367.0" y="171.0" font-size="17" fill="#a3aaa6" text-anchor="middle">channel + limits</text><text x="367.0" y="198.0" font-size="17" fill="#a3aaa6" text-anchor="middle">10 s, by generation</text><rect x="496" y="100" width="208" height="130" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="600.0" y="144.0" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Batched writes</text><text x="600.0" y="171.0" font-size="17" fill="#a3aaa6" text-anchor="middle">200 readings or 50 ms</text><text x="600.0" y="198.0" font-size="17" fill="#a3aaa6" text-anchor="middle">duplicates skipped</text><rect x="729" y="100" width="208" height="130" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="833.0" y="144.0" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Recent history</text><text x="833.0" y="171.0" font-size="17" fill="#a3aaa6" text-anchor="middle">last 48 in Redis</text><text x="833.0" y="198.0" font-size="17" fill="#a3aaa6" text-anchor="middle">no Postgres hit</text><rect x="962" y="100" width="208" height="130" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="1066.0" y="144.0" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">Dead-letter queue</text><text x="1066.0" y="171.0" font-size="17" fill="#a3aaa6" text-anchor="middle">after several retries</text><text x="1066.0" y="198.0" font-size="17" fill="#a3aaa6" text-anchor="middle">nothing is lost</text><text x="600" y="55" font-size="20" font-weight="700" fill="#f2f2f2" text-anchor="middle">The bottleneck was Postgres: many devices writing and many dashboards reading</text><text x="600" y="300" font-size="18" fill="#a3aaa6" text-anchor="middle">Write less often, read from memory, and never lose a reading.</text><rect x="30" y="330" width="1140" height="60" rx="14" fill="#1b1e1d" stroke="#4a504d" stroke-width="2"/><text x="600.0" y="365.5" font-size="19" font-weight="700" fill="#f2f2f2" text-anchor="middle">At-least-once delivery: only acknowledged writes leave the stream</text></svg>