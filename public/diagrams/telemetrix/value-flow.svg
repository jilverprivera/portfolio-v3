<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="60" width="150" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="105.0" y="98.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Device</text><text x="105.0" y="125.5" font-size="17" fill="#a1a1a1" text-anchor="middle">API key + ids</text><rect x="225" y="60" width="150" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="300.0" y="98.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Validate</text><text x="300.0" y="125.5" font-size="17" fill="#a1a1a1" text-anchor="middle">payload</text><path d="M180,105 L225,105" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="405" y="60" width="150" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="480.0" y="98.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Rate limit</text><text x="480.0" y="125.5" font-size="17" fill="#a1a1a1" text-anchor="middle">plan</text><path d="M375,105 L405,105" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="585" y="60" width="150" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="660.0" y="98.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Deduplicate</text><text x="660.0" y="125.5" font-size="17" fill="#a1a1a1" text-anchor="middle">message_id</text><path d="M555,105 L585,105" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="765" y="60" width="150" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="840.0" y="98.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Sequence</text><text x="840.0" y="125.5" font-size="17" fill="#a1a1a1" text-anchor="middle">per channel</text><path d="M735,105 L765,105" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="945" y="60" width="225" height="90" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="1057.5" y="98.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Redis Streams</text><text x="1057.5" y="125.5" font-size="17" fill="#a1a1a1" text-anchor="middle">32 shards by channel</text><path d="M900,105 L945,105" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M1057,150 L1057,210 L1057,220" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="945" y="220" width="225" height="70" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="1057.5" y="261.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">202 Accepted</text><text x="1057" y="320" font-size="16" fill="#a1a1a1" text-anchor="middle">Acknowledged once the stream confirms,</text><text x="1057" y="342" font-size="16" fill="#a1a1a1" text-anchor="middle">not when Postgres stores it (p99 ≤ 50 ms)</text><text x="600" y="205" font-size="20" font-weight="700" fill="#8cc765" text-anchor="middle">Ingestion</text><rect x="30" y="380" width="1140" height="160" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="414" font-size="22" font-weight="700" fill="#3ecf8e">After the acknowledgement</text><rect x="55" y="425" width="240" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="175.0" y="463.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Telemetry consumer</text><text x="175.0" y="490.5" font-size="17" fill="#a1a1a1" text-anchor="middle">batches of 200 or 50 ms</text><rect x="335" y="425" width="240" height="90" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="455.0" y="463.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Postgres</text><text x="455.0" y="490.5" font-size="17" fill="#a1a1a1" text-anchor="middle">partitioned by day</text><rect x="615" y="425" width="240" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="735.0" y="463.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Realtime hub</text><text x="735.0" y="490.5" font-size="17" fill="#a1a1a1" text-anchor="middle">WebSocket to dashboards</text><rect x="895" y="425" width="250" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="1020.0" y="463.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">Rules and actions</text><text x="1020.0" y="490.5" font-size="17" fill="#a1a1a1" text-anchor="middle">webhook · email · push</text><path d="M295,470 L335,470" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M575,470 L615,470" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M855,470 L895,470" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M1057,290 L1057,380" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="600" y="578" font-size="17" fill="#b8b8b8" text-anchor="middle">Target: a reading reaches the dashboard within 2 seconds (p95)</text></svg>