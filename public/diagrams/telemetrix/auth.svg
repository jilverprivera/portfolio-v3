<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7370"/></marker></defs><rect x="30" y="50" width="1140" height="230" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#8cc765">People · web and mobile</text><rect x="55" y="105" width="190" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="150.0" y="143.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Sign in</text><text x="150.0" y="170.5" font-size="17" fill="#a3aaa6" text-anchor="middle">password</text><rect x="290" y="105" width="210" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="395.0" y="143.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Supabase Auth</text><text x="395.0" y="170.5" font-size="17" fill="#a3aaa6" text-anchor="middle">JWT with role</text><rect x="545" y="105" width="210" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="650.0" y="143.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Go API</text><text x="650.0" y="170.5" font-size="17" fill="#a3aaa6" text-anchor="middle">checks the token</text><rect x="800" y="105" width="150" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="875.0" y="143.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">RLS</text><text x="875.0" y="170.5" font-size="17" fill="#a3aaa6" text-anchor="middle">owner_id</text><rect x="990" y="105" width="155" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="1067.5" y="157.0" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Own data</text><path d="M245,150 L290,150" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M500,150 L545,150" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M755,150 L800,150" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M950,150 L990,150" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="250" font-size="17" fill="#a3aaa6" text-anchor="middle">Roles: owner (platform admin) and developer. No organizations.</text><rect x="30" y="310" width="1140" height="230" rx="18" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="344" font-size="22" font-weight="700" fill="#f0883e">Devices</text><rect x="55" y="365" width="190" height="90" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="150.0" y="403.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Request</text><text x="150.0" y="430.5" font-size="17" fill="#a3aaa6" text-anchor="middle">3 headers</text><rect x="290" y="365" width="210" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="395.0" y="403.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">HMAC</text><text x="395.0" y="430.5" font-size="17" fill="#a3aaa6" text-anchor="middle">key + server pepper</text><rect x="545" y="365" width="210" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="650.0" y="403.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Account key</text><text x="650.0" y="430.5" font-size="17" fill="#a3aaa6" text-anchor="middle">tpk_ · 256 bits</text><rect x="800" y="365" width="150" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="875.0" y="403.5" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Device</text><text x="875.0" y="430.5" font-size="17" fill="#a3aaa6" text-anchor="middle">id match</text><rect x="990" y="365" width="155" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="1067.5" y="417.0" font-size="22" font-weight="700" fill="#f2f2f2" text-anchor="middle">Accepted</text><path d="M245,410 L290,410" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M500,410 L545,410" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M755,410 L800,410" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><path d="M950,410 L990,410" fill="none" stroke="#6b7370" stroke-width="2.5" marker-end="url(#a)"/><rect x="800" y="480" width="345" height="50" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="972.5" y="510.0" font-size="18" font-weight="700" fill="#f2f2f2" text-anchor="middle">Any failure: same 401</text><text x="250" y="500" font-size="17" fill="#a3aaa6" text-anchor="middle">Only the HMAC is stored; the key is shown once.</text></svg>