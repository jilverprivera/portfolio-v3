<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="50" width="1140" height="201" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#8cc765">Load of each room</text><rect x="55" y="105" width="340" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="225.0" y="138.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Room input</text><text x="225.0" y="164.0" font-size="16" fill="#a1a1a1" text-anchor="middle">width, length, height in m</text><text x="225.0" y="188.0" font-size="16" fill="#a1a1a1" text-anchor="middle">people in the room</text><text x="225.0" y="212.0" font-size="16" fill="#a1a1a1" text-anchor="middle">activity category</text><rect x="425" y="105" width="340" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="595.0" y="138.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Room load</text><text x="595.0" y="164.0" font-size="16" fill="#a1a1a1" text-anchor="middle">volume x 35 W per m³</text><text x="595.0" y="188.0" font-size="16" fill="#a1a1a1" text-anchor="middle">+ people x average W</text><text x="595.0" y="212.0" font-size="16" fill="#a1a1a1" text-anchor="middle">of the activity category</text><rect x="795" y="105" width="350" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="970.0" y="138.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Project total</text><text x="970.0" y="164.0" font-size="16" fill="#a1a1a1" text-anchor="middle">sum of all rooms</text><text x="970.0" y="188.0" font-size="16" fill="#a1a1a1" text-anchor="middle">saved with its inputs by</text><text x="970.0" y="212.0" font-size="16" fill="#a1a1a1" text-anchor="middle">POST /thermal-calculator/calculate</text><path d="M395,167 L425,167" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M765,167 L795,167" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="300" width="440" height="201" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="334" font-size="22" font-weight="700" fill="#3ecf8e">MINI_SPLIT</text><rect x="55" y="355" width="190" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="150.0" y="388.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Ratio r</text><text x="150.0" y="414.0" font-size="16" fill="#a1a1a1" text-anchor="middle">room kW / unit kW</text><text x="150.0" y="438.0" font-size="16" fill="#a1a1a1" text-anchor="middle">kept up to r = 1.2</text><text x="150.0" y="462.0" font-size="16" fill="#a1a1a1" text-anchor="middle">max 3 per room</text><rect x="265" y="355" width="190" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="360.0" y="388.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Class</text><text x="360.0" y="414.0" font-size="16" fill="#a1a1a1" text-anchor="middle">&lt; 0.8 UNDERSIZED</text><text x="360.0" y="438.0" font-size="16" fill="#a1a1a1" text-anchor="middle">0.8-1.0 OPTIMAL</text><text x="360.0" y="462.0" font-size="16" fill="#a1a1a1" text-anchor="middle">≤ 1.2 ACCEPTABLE</text><path d="M245,417 L265,417" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="490" y="300" width="680" height="201" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="510" y="334" font-size="22" font-weight="700" fill="#3ecf8e">MULTI_SPLIT</text><rect x="515" y="355" width="200" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="615.0" y="388.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Group rooms</text><text x="615.0" y="414.0" font-size="16" fill="#a1a1a1" text-anchor="middle">one unit if total</text><text x="615.0" y="438.0" font-size="16" fill="#a1a1a1" text-anchor="middle">≤ 12.31 kW, else</text><text x="615.0" y="462.0" font-size="16" fill="#a1a1a1" text-anchor="middle">largest room first</text><rect x="735" y="355" width="200" height="148" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="835.0" y="388.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Outdoor unit</text><text x="835.0" y="414.0" font-size="16" fill="#a1a1a1" text-anchor="middle">18/27/36/42 kBtu</text><text x="835.0" y="438.0" font-size="16" fill="#a1a1a1" text-anchor="middle">smallest that fits</text><text x="835.0" y="462.0" font-size="16" fill="#a1a1a1" text-anchor="middle">the load, with a</text><text x="835.0" y="486.0" font-size="16" fill="#a1a1a1" text-anchor="middle">valid combination</text><rect x="955" y="355" width="200" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="1055.0" y="388.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Load class</text><text x="1055.0" y="414.0" font-size="16" fill="#a1a1a1" text-anchor="middle">&lt; 70% UNDERSIZED</text><text x="1055.0" y="438.0" font-size="16" fill="#a1a1a1" text-anchor="middle">70 to 100% OPTIMAL</text><text x="1055.0" y="462.0" font-size="16" fill="#a1a1a1" text-anchor="middle">&gt; 100% OVERLOADED</text><path d="M715,417 L735,429" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M935,429 L955,417" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M970,251 L970,275 L190,275 L190,355" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="200" y="268" font-size="15" fill="#b8b8b8" text-anchor="start">installationType</text><path d="M685,275 L685,355" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/></svg>