<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="50" width="1140" height="342" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#8cc765">Ways in</text><rect x="55" y="105" width="250" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="180.0" y="138.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">authorize-url</text><text x="180.0" y="164.0" font-size="16" fill="#a1a1a1" text-anchor="middle">GET, portal web or admin</text><text x="180.0" y="188.0" font-size="16" fill="#a1a1a1" text-anchor="middle">state signed with HMAC</text><text x="180.0" y="212.0" font-size="16" fill="#a1a1a1" text-anchor="middle">sign-in at Midea MAS</text><rect x="335" y="105" width="250" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="460.0" y="138.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">callback</text><text x="460.0" y="164.0" font-size="16" fill="#a1a1a1" text-anchor="middle">POST, code and state</text><text x="460.0" y="188.0" font-size="16" fill="#a1a1a1" text-anchor="middle">state validated</text><text x="460.0" y="212.0" font-size="16" fill="#a1a1a1" text-anchor="middle">tokens from Midea MAS</text><rect x="615" y="105" width="250" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="740.0" y="138.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Provision user</text><text x="740.0" y="164.0" font-size="16" fill="#a1a1a1" text-anchor="middle">finds or creates the user</text><text x="740.0" y="188.0" font-size="16" fill="#a1a1a1" text-anchor="middle">default role per portal</text><text x="740.0" y="212.0" font-size="16" fill="#a1a1a1" text-anchor="middle">new user picks a role</text><path d="M305,167 L335,167" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M585,167 L615,167" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="246" width="250" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="180.0" y="279.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">login</text><text x="180.0" y="305.0" font-size="16" fill="#a1a1a1" text-anchor="middle">POST /auth/login</text><text x="180.0" y="329.0" font-size="16" fill="#a1a1a1" text-anchor="middle">bcrypt check</text><text x="180.0" y="353.0" font-size="16" fill="#a1a1a1" text-anchor="middle">lockout after failures</text><rect x="335" y="246" width="250" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="460.0" y="279.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">OTP challenge</text><text x="460.0" y="305.0" font-size="16" fill="#a1a1a1" text-anchor="middle">login-otp email</text><text x="460.0" y="329.0" font-size="16" fill="#a1a1a1" text-anchor="middle">sent with SendGrid</text><text x="460.0" y="353.0" font-size="16" fill="#a1a1a1" text-anchor="middle">when required</text><rect x="615" y="246" width="250" height="124" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="740.0" y="279.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">verify-otp</text><text x="740.0" y="305.0" font-size="16" fill="#a1a1a1" text-anchor="middle">code checked against</text><text x="740.0" y="329.0" font-size="16" fill="#a1a1a1" text-anchor="middle">the challenge</text><text x="740.0" y="353.0" font-size="16" fill="#a1a1a1" text-anchor="middle">or resend-otp</text><path d="M305,308 L335,308" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M585,308 L615,308" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="905" y="105" width="240" height="262" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="1025.0" y="195.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Internal JWTs</text><text x="1025.0" y="221.0" font-size="16" fill="#a1a1a1" text-anchor="middle">access token, 15 min</text><text x="1025.0" y="245.0" font-size="16" fill="#a1a1a1" text-anchor="middle">refresh token, 7 days</text><text x="1025.0" y="269.0" font-size="16" fill="#a1a1a1" text-anchor="middle">firstLogin forces a</text><text x="1025.0" y="293.0" font-size="16" fill="#a1a1a1" text-anchor="middle">password change</text><path d="M865,167 L905,167" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M865,308 L905,308" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="445" width="1140" height="345" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="479" font-size="22" font-weight="700" fill="#3ecf8e">Each request</text><rect x="55" y="500" width="250" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="180.0" y="533.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">JwtAuthGuard</text><text x="180.0" y="559.0" font-size="16" fill="#a1a1a1" text-anchor="middle">verifies the access token</text><text x="180.0" y="583.0" font-size="16" fill="#a1a1a1" text-anchor="middle">@Public() routes pass</text><text x="180.0" y="607.0" font-size="16" fill="#a1a1a1" text-anchor="middle">request.user = claims</text><rect x="335" y="500" width="250" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="460.0" y="533.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">ModuleActionGuard</text><text x="460.0" y="559.0" font-size="16" fill="#a1a1a1" text-anchor="middle">one roleModule query</text><text x="460.0" y="583.0" font-size="16" fill="#a1a1a1" text-anchor="middle">module and action</text><text x="460.0" y="607.0" font-size="16" fill="#a1a1a1" text-anchor="middle">OR when several listed</text><rect x="615" y="500" width="250" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="740.0" y="533.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Pipes and handler</text><text x="740.0" y="559.0" font-size="16" fill="#a1a1a1" text-anchor="middle">Sanitization, Validation</text><text x="740.0" y="583.0" font-size="16" fill="#a1a1a1" text-anchor="middle">Handler and UseCase</text><text x="740.0" y="607.0" font-size="16" fill="#a1a1a1" text-anchor="middle">Prisma*Repository</text><rect x="895" y="500" width="250" height="124" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="1020.0" y="533.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">AuditLogHandler</text><text x="1020.0" y="559.0" font-size="16" fill="#a1a1a1" text-anchor="middle">event_log row</text><text x="1020.0" y="583.0" font-size="16" fill="#a1a1a1" text-anchor="middle">FAILED if a step throws</text><text x="1020.0" y="607.0" font-size="16" fill="#a1a1a1" text-anchor="middle">priority LOW to CRITICAL</text><path d="M305,562 L335,562" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M585,562 L615,562" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M865,562 L895,562" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="335" y="665" width="250" height="100" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="460.0" y="698.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">403 Forbidden</text><text x="460.0" y="724.0" font-size="16" fill="#a1a1a1" text-anchor="middle">Missing permission:</text><text x="460.0" y="748.0" font-size="16" fill="#a1a1a1" text-anchor="middle">MODULE:ACTION</text><path d="M460,624 L460,665" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="472.0" y="648" font-size="15" fill="#b8b8b8" text-anchor="start">no grant</text><path d="M1025,392 L1025,418 L255,418 L255,500" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="410" font-size="15" fill="#b8b8b8" text-anchor="middle">Authentication: Bearer</text></svg>