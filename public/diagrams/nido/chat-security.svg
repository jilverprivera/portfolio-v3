<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="50" width="1140" height="330" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#3ecf8e">Sending a message · encrypted before it is stored</text><rect x="55" y="100" width="230" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="170.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Gateway</text><text x="170.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">send_message event</text><text x="170.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">token already checked</text><rect x="345" y="100" width="230" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="460.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">DEK cache</text><text x="460.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">one key per chat</text><text x="460.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">TTL 5 minutes</text><rect x="635" y="100" width="230" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="750.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">MessageCipher</text><text x="750.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">AES-256-GCM</text><text x="750.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">random IV and salt</text><rect x="925" y="100" width="220" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="1035.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">MongoDB</text><text x="1035.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">ciphertext, iv,</text><text x="1035.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">authTag, salt</text><path d="M285,150 H345" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M575,150 H635" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="605" y="140" font-size="16" fill="#b8b8b8" text-anchor="middle">key</text><path d="M865,150 H925" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="345" y="245" width="230" height="100" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="460.0" y="275.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">KMS</text><text x="460.0" y="302.0" font-size="17" fill="#a1a1a1" text-anchor="middle">unwraps the stored</text><text x="460.0" y="329.0" font-size="17" fill="#a1a1a1" text-anchor="middle">data key on a miss</text><path d="M460.0,200 V245" fill="none" stroke="#6e6e73" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="470.0" y="228" font-size="16" fill="#b8b8b8" text-anchor="start">miss</text><text x="635" y="270" font-size="16" fill="#b8b8b8" text-anchor="start">The salt is bound as additional authenticated data,</text><text x="635" y="295" font-size="16" fill="#b8b8b8" text-anchor="start">so any tampering fails the authTag check.</text><text x="635" y="330" font-size="16" fill="#b8b8b8" text-anchor="start">Reading reverses the steps with the same key.</text><rect x="30" y="410" width="1140" height="320" rx="18" fill="none" stroke="#e5534b" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="444" font-size="22" font-weight="700" fill="#e5534b">Realtime after the 15-minute token expires</text><text x="55" y="520" font-size="18" fill="#b8b8b8" text-anchor="start">Before</text><text x="55" y="650" font-size="18" fill="#b8b8b8" text-anchor="start">After</text><rect x="150" y="470" width="220" height="100" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="260.0" y="500.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Cloud Run timeout</text><text x="260.0" y="527.0" font-size="17" fill="#a1a1a1" text-anchor="middle">300 s by default</text><text x="260.0" y="554.0" font-size="17" fill="#a1a1a1" text-anchor="middle">cuts every socket</text><rect x="400" y="470" width="220" height="100" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="510.0" y="500.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Client reconnects</text><text x="510.0" y="527.0" font-size="17" fill="#a1a1a1" text-anchor="middle">with the old token</text><text x="510.0" y="554.0" font-size="17" fill="#a1a1a1" text-anchor="middle">after 15 minutes</text><path d="M370,520 H400" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="650" y="470" width="220" height="100" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="760.0" y="500.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Server disconnects</text><text x="760.0" y="527.0" font-size="17" fill="#a1a1a1" text-anchor="middle">on a bad token</text><text x="760.0" y="554.0" font-size="17" fill="#a1a1a1" text-anchor="middle">inside the handler</text><path d="M620,520 H650" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="900" y="470" width="220" height="100" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="1010.0" y="500.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Realtime stops</text><text x="1010.0" y="527.0" font-size="17" fill="#a1a1a1" text-anchor="middle">client never retries</text><text x="1010.0" y="554.0" font-size="17" fill="#a1a1a1" text-anchor="middle">after a server drop</text><path d="M870,520 H900" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="150" y="600" width="220" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="260.0" y="630.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Auth middleware</text><text x="260.0" y="657.0" font-size="17" fill="#a1a1a1" text-anchor="middle">checks the JWT</text><text x="260.0" y="684.0" font-size="17" fill="#a1a1a1" text-anchor="middle">before the connection</text><rect x="400" y="600" width="220" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="510.0" y="630.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">connect_error</text><text x="510.0" y="657.0" font-size="17" fill="#a1a1a1" text-anchor="middle">TOKEN_EXPIRED or</text><text x="510.0" y="684.0" font-size="17" fill="#a1a1a1" text-anchor="middle">UNAUTHORIZED</text><path d="M370,650 H400" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="650" y="600" width="220" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="760.0" y="630.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Client refreshes</text><text x="760.0" y="657.0" font-size="17" fill="#a1a1a1" text-anchor="middle">the access token</text><text x="760.0" y="684.0" font-size="17" fill="#a1a1a1" text-anchor="middle">before each handshake</text><path d="M620,650 H650" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="900" y="600" width="220" height="100" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="1010.0" y="630.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Manual reconnect</text><text x="1010.0" y="657.0" font-size="17" fill="#a1a1a1" text-anchor="middle">capped backoff</text><text x="1010.0" y="684.0" font-size="17" fill="#a1a1a1" text-anchor="middle">also on server drop</text><path d="M870,650 H900" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/></svg>