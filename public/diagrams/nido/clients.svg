<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><text x="44" y="34" font-size="16" fill="#a1a1a1">Client</text><text x="354" y="34" font-size="16" fill="#a1a1a1">Sign-in</text><text x="694" y="34" font-size="16" fill="#a1a1a1">What it opens</text><text x="1134" y="34" font-size="16" fill="#a1a1a1">Backend</text><rect x="24" y="50" width="1000" height="190" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".6"/><rect x="50" y="68" width="230" height="154" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="165.0" y="102" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Resident app</text><text x="165.0" y="132" font-size="16" fill="#a1a1a1" text-anchor="middle">Expo · React Native</text><text x="165.0" y="156" font-size="16" fill="#a1a1a1" text-anchor="middle">residents only</text><line x1="280" y1="145.0" x2="360" y2="145.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="68" width="270" height="154" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="495.0" y="102" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Sign in</text><text x="495.0" y="132" font-size="16" fill="#a1a1a1" text-anchor="middle">POST /auth/sign-in</text><text x="495.0" y="156" font-size="16" fill="#a1a1a1" text-anchor="middle">OTP on a new device,</text><text x="495.0" y="180" font-size="16" fill="#a1a1a1" text-anchor="middle">by email or SMS</text><line x1="630" y1="145.0" x2="700" y2="145.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="68" width="280" height="154" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="840.0" y="102" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Five tabs</text><text x="840.0" y="132" font-size="16" fill="#a1a1a1" text-anchor="middle">Home · Notices · Chats</text><text x="840.0" y="156" font-size="16" fill="#a1a1a1" text-anchor="middle">Access · Explore</text><text x="840.0" y="180" font-size="16" fill="#a1a1a1" text-anchor="middle">Explore follows the</text><text x="840.0" y="204" font-size="16" fill="#a1a1a1" text-anchor="middle">condominium's featureSet</text><line x1="980" y1="145.0" x2="1130" y2="145.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="255" width="1000" height="190" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".6"/><rect x="50" y="273" width="230" height="154" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="165.0" y="307" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Staff app</text><text x="165.0" y="337" font-size="16" fill="#a1a1a1" text-anchor="middle">Expo · React Native</text><text x="165.0" y="361" font-size="16" fill="#a1a1a1" text-anchor="middle">guards</text><line x1="280" y1="350.0" x2="360" y2="350.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="273" width="270" height="154" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="495.0" y="307" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Sign in</text><text x="495.0" y="337" font-size="16" fill="#a1a1a1" text-anchor="middle">Same flow with clientApp</text><text x="495.0" y="361" font-size="16" fill="#a1a1a1" text-anchor="middle">STAFF. Residents are</text><text x="495.0" y="385" font-size="16" fill="#a1a1a1" text-anchor="middle">rejected, no sign-up</text><line x1="630" y1="350.0" x2="700" y2="350.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="273" width="280" height="154" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="840.0" y="307" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Five tabs</text><text x="840.0" y="337" font-size="16" fill="#a1a1a1" text-anchor="middle">Visitors · History · Verify</text><text x="840.0" y="361" font-size="16" fill="#a1a1a1" text-anchor="middle">Pre-checking · Settings</text><text x="840.0" y="385" font-size="16" fill="#a1a1a1" text-anchor="middle">Verify scans the QR and</text><text x="840.0" y="409" font-size="16" fill="#a1a1a1" text-anchor="middle">calls passes/validate-by-qr</text><line x1="980" y1="350.0" x2="1130" y2="350.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="460" width="1000" height="190" rx="18" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="8 6" opacity=".6"/><rect x="50" y="478" width="230" height="154" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="165.0" y="512" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Web portal</text><text x="165.0" y="542" font-size="16" fill="#a1a1a1" text-anchor="middle">Next.js · static export</text><text x="165.0" y="566" font-size="16" fill="#a1a1a1" text-anchor="middle">Firebase Hosting</text><line x1="280" y1="555.0" x2="360" y2="555.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="478" width="270" height="154" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="495.0" y="512" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Sign in</text><text x="495.0" y="542" font-size="16" fill="#a1a1a1" text-anchor="middle">Email and password,</text><text x="495.0" y="566" font-size="16" fill="#a1a1a1" text-anchor="middle">then a web session</text><text x="495.0" y="590" font-size="16" fill="#a1a1a1" text-anchor="middle">for the user's role</text><line x1="630" y1="555.0" x2="700" y2="555.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="478" width="280" height="154" rx="14" fill="#3a2412" stroke="#f0883e" stroke-width="2"/><text x="840.0" y="512" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Areas by role</text><text x="840.0" y="542" font-size="16" fill="#a1a1a1" text-anchor="middle">Condominium admin</text><text x="840.0" y="566" font-size="16" fill="#a1a1a1" text-anchor="middle">Platform admin · Partner</text><text x="840.0" y="590" font-size="16" fill="#a1a1a1" text-anchor="middle">Provider · Guard, if the</text><text x="840.0" y="614" font-size="16" fill="#a1a1a1" text-anchor="middle">condominium allows it</text><line x1="980" y1="555.0" x2="1130" y2="555.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="665" width="1000" height="190" rx="18" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-dasharray="8 6" opacity=".6"/><rect x="50" y="683" width="230" height="154" rx="14" fill="#1c2024" stroke="#a1a1a1" stroke-width="2"/><text x="165.0" y="717" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Public web pages</text><text x="165.0" y="747" font-size="16" fill="#a1a1a1" text-anchor="middle">no account needed</text><text x="165.0" y="771" font-size="16" fill="#a1a1a1" text-anchor="middle">opened from a link</text><line x1="280" y1="760.0" x2="360" y2="760.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="683" width="270" height="154" rx="14" fill="#1c2024" stroke="#a1a1a1" stroke-width="2"/><text x="495.0" y="717" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">No sign in</text><text x="495.0" y="747" font-size="16" fill="#a1a1a1" text-anchor="middle">A token in the link</text><text x="495.0" y="771" font-size="16" fill="#a1a1a1" text-anchor="middle">stands in for a login</text><line x1="630" y1="760.0" x2="700" y2="760.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="683" width="280" height="154" rx="14" fill="#1c2024" stroke="#a1a1a1" stroke-width="2"/><text x="840.0" y="717" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Link pages</text><text x="840.0" y="747" font-size="16" fill="#a1a1a1" text-anchor="middle">Visitor pre-registration</text><text x="840.0" y="771" font-size="16" fill="#a1a1a1" text-anchor="middle">Amenity invitations</text><text x="840.0" y="795" font-size="16" fill="#a1a1a1" text-anchor="middle">Password setup and reset</text><text x="840.0" y="819" font-size="16" fill="#a1a1a1" text-anchor="middle">Account deletion</text><line x1="980" y1="760.0" x2="1130" y2="760.0" stroke="#6e6e73" stroke-width="2" marker-end="url(#a)"/><rect x="1130" y="50" width="240" height="805" rx="18" fill="#1c2024" stroke="#a1a1a1" stroke-width="2"/><text x="1250" y="422.5" font-size="22" font-weight="700" fill="#f5f5f2" text-anchor="middle">NIDO API</text><text x="1250" y="452.5" font-size="16" fill="#a1a1a1" text-anchor="middle">One backend</text><text x="1250" y="476.5" font-size="16" fill="#a1a1a1" text-anchor="middle">REST and the</text><text x="1250" y="500.5" font-size="16" fill="#a1a1a1" text-anchor="middle">Socket.IO chat</text><text x="1250" y="524.5" font-size="16" fill="#a1a1a1" text-anchor="middle">gateway for every</text><text x="1250" y="548.5" font-size="16" fill="#a1a1a1" text-anchor="middle">client</text></svg>