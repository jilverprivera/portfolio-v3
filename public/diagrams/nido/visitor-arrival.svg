<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e73"/></marker></defs><rect x="30" y="50" width="1140" height="170" rx="18" fill="none" stroke="#8cc765" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="84" font-size="22" font-weight="700" fill="#8cc765">Before the visit · pre-registration</text><rect x="55" y="105" width="350" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="230.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Resident shares link</text><text x="230.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">one link per unit</text><text x="230.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">valid 24 hours</text><rect x="427" y="105" width="350" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="602.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Visitor fills the form</text><text x="602.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">web page, no install</text><text x="602.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">link is single use</text><path d="M405,150 H427" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><rect x="799" y="105" width="350" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="974.0" y="130.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Pre-registration</text><text x="974.0" y="157.0" font-size="17" fill="#a1a1a1" text-anchor="middle">Pending, Approved, Used,</text><text x="974.0" y="184.0" font-size="17" fill="#a1a1a1" text-anchor="middle">Expired, Rejected</text><path d="M777,150 H799" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M600,220 V270" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="612" y="252" font-size="16" fill="#b8b8b8" text-anchor="start">visitor reaches the gate</text><rect x="30" y="270" width="1140" height="410" rx="18" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/><text x="50" y="304" font-size="22" font-weight="700" fill="#3ecf8e">At the gate · guard in the staff app or web portal</text><rect x="55" y="385" width="190" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="150.0" y="410.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Guard</text><text x="150.0" y="437.0" font-size="17" fill="#a1a1a1" text-anchor="middle">scans the pass QR</text><text x="150.0" y="464.0" font-size="17" fill="#a1a1a1" text-anchor="middle">or logs a walk-in</text><rect x="275" y="325" width="230" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="390.0" y="363.5" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Visitor alone</text><text x="390.0" y="390.5" font-size="17" fill="#a1a1a1" text-anchor="middle">with a valid pass</text><rect x="275" y="445" width="230" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="390.0" y="470.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Needs approval</text><text x="390.0" y="497.0" font-size="17" fill="#a1a1a1" text-anchor="middle">companions, or no</text><text x="390.0" y="524.0" font-size="17" fill="#a1a1a1" text-anchor="middle">pre-registration</text><rect x="545" y="325" width="250" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="670.0" y="350.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Check-in</text><text x="670.0" y="377.0" font-size="17" fill="#a1a1a1" text-anchor="middle">resident gets a</text><text x="670.0" y="404.0" font-size="17" fill="#a1a1a1" text-anchor="middle">visitor-in notice</text><rect x="545" y="445" width="250" height="90" rx="14" fill="#10261d" stroke="#3ecf8e" stroke-width="2"/><text x="670.0" y="470.0" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Review access</text><text x="670.0" y="497.0" font-size="17" fill="#a1a1a1" text-anchor="middle">resident or guard decides</text><text x="670.0" y="524.0" font-size="17" fill="#a1a1a1" text-anchor="middle">first decision wins</text><rect x="865" y="325" width="280" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="1005.0" y="363.5" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Access history</text><text x="1005.0" y="390.5" font-size="17" fill="#a1a1a1" text-anchor="middle">every outcome is logged</text><rect x="865" y="445" width="280" height="90" rx="14" fill="#1d3326" stroke="#8cc765" stroke-width="2"/><text x="1005.0" y="483.5" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Approved</text><text x="1005.0" y="510.5" font-size="17" fill="#a1a1a1" text-anchor="middle">guard authorizes entry</text><rect x="865" y="565" width="280" height="90" rx="14" fill="#3a1716" stroke="#e5534b" stroke-width="2"/><text x="1005.0" y="603.5" font-size="20" font-weight="700" fill="#f5f5f2" text-anchor="middle">Rejected</text><text x="1005.0" y="630.5" font-size="17" fill="#a1a1a1" text-anchor="middle">entry is denied</text><path d="M245,430 H260 V370 H275" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M245,430 H260 V490 H275" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M505,370 H545" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M505,490 H545" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M795,370 H865" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><path d="M795,490 H865" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="830" y="478" font-size="16" fill="#b8b8b8" text-anchor="middle">approve</text><path d="M755,535 V610 H865" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="815" y="602" font-size="16" fill="#b8b8b8" text-anchor="middle">reject</text><path d="M1005.0,445 V415" fill="none" stroke="#6e6e73" stroke-width="2.5" marker-end="url(#a)"/><text x="995.0" y="434" font-size="16" fill="#b8b8b8" text-anchor="end">logged</text></svg>