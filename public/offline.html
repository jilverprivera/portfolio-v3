<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f5f2" />
    <title>Offline · Jilver Pacheco</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 32px;
        background: #f5f5f2;
        color: #0a0a0a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: clamp(40px, 10vw, 96px); line-height: 1; letter-spacing: -0.03em; text-transform: uppercase; }
      p { font-size: 18px; color: #45453f; }
      button {
        align-self: flex-start;
        margin-top: 16px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #0a0a0a;
        color: #f5f5f2;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="title">You're offline</h1>
    <p id="message">Check your connection and try again.</p>
    <button id="retry" type="button" onclick="location.reload()">Try again</button>
    <script>
      // A static file can't be rendered per language, so it follows the same cookie as the site.
      if (/(^|;\s*)lang=es(;|$)/.test(document.cookie)) {
        document.documentElement.lang = "es";
        document.title = "Sin conexión · Jilver Pacheco";
        document.getElementById("title").textContent = "Sin conexión";
        document.getElementById("message").textContent = "Revisa tu conexión e inténtalo de nuevo.";
        document.getElementById("retry").textContent = "Reintentar";
      }
    </script>
  </body>
</html>
